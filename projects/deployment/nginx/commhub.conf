# ==============================================================================
# CommunityHub v1.0 Production Nginx Configuration (RFP §8, §10)
# Configured for:
#   1. Test Instance: commhub.heconf.net
#   2. Production Instance: hapacgh.org
# ==============================================================================

# Gzip Compression Optimization
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

# ==============================================================================
# 1. TEST INSTANCE: commhub.heconf.net
# ==============================================================================

# HTTP (Port 80) -> Redirect all traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name commhub.heconf.net;

    # Let's Encrypt / Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS (Port 443) Server Block - Test Instance
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name commhub.heconf.net;

    # SSL Certificates (Managed via certbot --nginx)
    ssl_certificate /etc/letsencrypt/live/commhub.heconf.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/commhub.heconf.net/privkey.pem;

    # Modern SSL Security Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Frontend Static Distribution Directory (built via npm run build)
    root /var/www/communityhub/frontend/dist;
    index index.html;

    # Static Assets with Long-Term Caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # API Reverse Proxy -> Node.js backend running on 127.0.0.1:5000
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Client body limit for ID uploads & media (5MB)
        client_max_body_size 5M;
    }

    # SPA Client Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ==============================================================================
